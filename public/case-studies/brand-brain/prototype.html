<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body style="margin:0">
<title>Superspace Brand Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: product shell = slim nav + one working canvas; Superspace's own sage/teal system, light only by design */
  :root{
    color-scheme:light;
    --bg:#f5f5f5; --panel:#ffffff; --warm:#f8f9f3;
    --line:#e6e8e4; --line2:#d9ddd8;
    --ink:#0f2523; --text:#1f2a27; --muted:#5f6b67; --subtle:#8a948f;
    --dark:#0b211f; --teal:#3b7567; --teal-h:#326457; --teal-soft:#d2e5d1; --teal-text:#2c5a4e;
    --sage:#e5eae4; --sage2:#eaede6; --sage3:#dde3d7; --chip:#f1f1ef; --mint:#eef4ee;
    --blue-bg:#d3e5fb; --blue-text:#2e5a82; --yellow-bg:#fff0a6; --yellow-text:#5b4b00; --yellow-line:#e0b400;
    --red:#c94143; --red-bg:#fce2e1; --lime:#c8f25f; --focus:#3b7567;
    --b-red:#e0463a; --b-sky:#8fc6ec; --b-sun:#f5b942; --b-navy:#1d2b64; --b-sand:#f3ece0;
    --sans:'Inter',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --r-sm:8px; --r:12px; --r-lg:16px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:14px; -webkit-font-smoothing:antialiased; overflow:hidden;}
  button,input,textarea,select{font:inherit; color:inherit;}
  button{cursor:pointer; background:none; border:0; padding:0;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:6px;}
  svg.i{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0;}
  svg.i.s{width:15px; height:15px;} svg.i.xs{width:13px; height:13px;}
  h1,h2,h3{margin:0; font-weight:500; color:var(--ink); text-wrap:balance;}
  p{margin:0;}
  .num{font-variant-numeric:tabular-nums;}

  /* ---------- shell ---------- */
  .app{display:grid; grid-template-columns:auto minmax(0,1fr); grid-template-rows:minmax(0,1fr); height:100vh; height:100dvh;}
  .side{min-height:0; overflow-y:auto; width:232px; background:var(--bg); border-right:1px solid #dee0df; display:flex; flex-direction:column; padding:16px 12px 12px; gap:4px; transition:width .2s ease; overflow:hidden;}
  .side.rail{width:60px; padding-inline:10px;}
  .side-top{display:flex; align-items:center; justify-content:space-between; height:32px; padding:0 4px; margin-bottom:10px;}
  .word{font-weight:700; font-size:19px; letter-spacing:-0.9px; color:var(--ink); white-space:nowrap;}
  .mark{width:22px; height:22px; color:var(--ink);}
  .icon-btn{width:30px; height:30px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; color:var(--muted); position:relative;}
  .icon-btn:hover{background:var(--sage2); color:var(--ink);}
  .badge{position:absolute; top:-3px; right:-4px; background:#d7373b; color:#fff; font-size:10px; font-weight:600; border-radius:8px; padding:0 4px; line-height:14px;}
  .create{display:flex; align-items:center; gap:8px; height:36px; padding:0 12px; border-radius:18px; background:var(--dark); color:#fff; font-weight:500; margin-bottom:10px; white-space:nowrap;}
  .create:hover{background:#133330;}
  .side.rail .create{width:36px; padding:0; justify-content:center; margin-inline:2px;}
  .nav-i{display:flex; align-items:center; gap:10px; height:34px; padding:0 10px; border-radius:8px; color:var(--text); white-space:nowrap; text-align:left; width:100%;}
  .nav-i:hover{background:var(--sage2);}
  .nav-i:disabled{opacity:.4; cursor:not-allowed; pointer-events:none;}
  .nav-i.on{background:var(--sage3); font-weight:500;}
  .side.rail .nav-i{justify-content:center; padding:0;}
  .side.rail .lbl, .side.rail .side-sec, .side.rail .word, .side.rail .me-name{display:none;}
  .side-sec{font-size:12px; color:var(--subtle); padding:14px 10px 6px;}
  .thread{display:flex; align-items:center; gap:9px; height:30px; padding:0 10px; border-radius:8px; font-size:13px; color:var(--text); width:100%; text-align:left;}
  .thread:hover{background:var(--sage2);}
  .thread span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .side-bottom{margin-top:auto; display:flex; flex-direction:column; gap:4px; padding-top:8px; border-top:1px solid #e3e5e2;}
  .me{display:flex; align-items:center; gap:10px; padding:6px 8px;}
  .ava{width:26px; height:26px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:600; color:#fff; background:#8fb4a6; flex-shrink:0;}
  .main{overflow-y:auto; overflow-x:hidden; position:relative; min-height:0; height:100%; -webkit-overflow-scrolling:touch;}
  .page{max-width:1180px; margin:0 auto; padding:28px 36px 64px;}
  .page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px;}
  .crumb{font-size:12.5px; color:var(--muted); margin-bottom:4px;}
  .title{font-size:26px; letter-spacing:-0.4px;}
  .card{background:var(--panel); border-radius:var(--r-lg);}
  .muted{color:var(--muted);}

  /* ---------- controls ---------- */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; height:36px; padding:0 16px; border-radius:9999px; font-size:13.5px; font-weight:500; white-space:nowrap; border:1px solid var(--line2); background:var(--panel); color:var(--ink); transition:background .15s ease, border-color .15s ease, opacity .15s ease;}
  .btn:hover{background:var(--chip);}
  .btn.teal{background:var(--teal); border-color:var(--teal); color:#fff;}
  .btn.teal:hover{background:var(--teal-h);}
  .btn.dark{background:var(--dark); border-color:var(--dark); color:#fff;}
  .btn.dark:hover{background:#133330;}
  .btn.ghost{border-color:transparent; background:transparent; color:var(--muted);}
  .btn.ghost:hover{color:var(--ink); background:var(--chip);}
  .btn.sm{height:30px; padding:0 12px; font-size:12.5px;}
  .btn.lg{height:44px; padding:0 24px; font-size:14.5px;}
  .btn[disabled]{opacity:.45; pointer-events:none;}
  .chip{display:inline-flex; align-items:center; gap:7px; height:32px; padding:0 14px; border-radius:9999px; background:var(--chip); font-size:13px; white-space:nowrap; border:1px solid transparent;}
  button.chip:hover{border-color:var(--line2);}
  .chip.on{background:var(--teal-soft); color:var(--teal-text);}
  .tag{display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 8px; border-radius:6px; font-size:12px; white-space:nowrap;}
  .tag.blue{background:var(--blue-bg); color:var(--blue-text);}
  .tag.yellow{background:var(--yellow-bg); color:var(--yellow-text);}
  .tag.gray{background:#e8e9e6; color:#4f5752;}
  .tag.green{background:var(--teal-soft); color:var(--teal-text);}
  .tag.red{background:var(--red-bg); color:var(--red);}
  .src{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--teal-text); background:#fff; border:1px solid #d5e3d6; border-radius:9999px; padding:2px 9px; white-space:nowrap;}
  .field{display:flex; align-items:center; gap:10px; height:46px; border-radius:var(--r); background:#f6f8f3; border:1px solid #e3e7e0; padding:0 14px;}
  .field input{flex:1; min-width:0; border:0; background:transparent; outline:none; font-size:14px;}
  .ok{width:18px; height:18px; border-radius:50%; background:var(--teal); color:#fff; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;}
  .spin{width:14px; height:14px; border-radius:50%; border:2px solid #cfd8d2; border-top-color:var(--teal); animation:spin .8s linear infinite; flex-shrink:0;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .tabs{display:flex; gap:8px; flex-wrap:wrap;}
  .tab{height:38px; padding:0 18px; border-radius:19px; font-size:14px; font-weight:500; background:var(--panel); border:1px solid #e1e4df; color:var(--ink);}
  .tab:hover{border-color:var(--line2);}
  .tab.on{background:var(--teal-soft); border-color:var(--teal-soft); color:var(--teal-text);}
  .toggle{width:36px; height:20px; border-radius:10px; background:var(--line2); position:relative; flex-shrink:0; transition:background .2s;}
  .toggle::after{content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform .2s;}
  .toggle[aria-checked="true"]{background:var(--teal);}
  .toggle[aria-checked="true"]::after{transform:translateX(16px);}
  .flash{animation:flash 1.4s ease;}
  @keyframes flash{0%{background:#fff3b0;} 100%{background:transparent;}}
  .fade{animation:fade .35s ease both;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  /* ---------- onboarding ---------- */
  /* sign up */
  .su{position:fixed; inset:0; z-index:45; display:grid; grid-template-columns:1fr 1fr; background:var(--su-bg); transition:background .8s ease; overflow:auto;}
  .su-left{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; padding:40px 24px;}
  .su-word{font-size:clamp(44px,5.4vw,76px); font-weight:500; letter-spacing:-.045em; line-height:1; color:var(--su-ink); transition:color .8s ease;}
  .su-card{width:100%; max-width:420px; background:#fff; border-radius:10px; padding:30px 32px 26px; box-shadow:0 20px 50px -20px rgba(0,0,0,.25); display:flex; flex-direction:column;}
  .su-card h1{font-size:22px; font-weight:500; letter-spacing:-.3px; text-align:center; margin:0 0 22px; color:var(--ink);}
  .su-google{display:flex; align-items:center; justify-content:center; gap:10px; height:40px; border-radius:9999px; border:1px solid #dfe2de; background:#fff; font-size:13.5px; color:var(--ink);}
  .su-google:hover{background:#f6f7f4;}
  .su-or{text-align:center; font-size:12.5px; color:var(--muted); margin:16px 0 6px;}
  .su-l{font-size:12.5px; font-weight:500; color:var(--ink); margin:12px 0 7px;}
  .su-in{width:100%; height:40px; border-radius:6px; border:1px solid #e3e6e1; background:#f5f6f2; padding:0 12px; font:inherit; font-size:13.5px; color:var(--ink); outline:none;}
  .su-in:focus{border-color:var(--teal); background:#fff; box-shadow:0 0 0 3px var(--teal-soft);}
  .su-pw{position:relative;} .su-pw .su-in{background:#fff; padding-right:56px;}
  .su-eye{position:absolute; right:8px; top:50%; transform:translateY(-50%); font-size:12px; color:var(--muted); padding:4px 6px;}
  .su-hint{font-size:11.5px; color:var(--muted); margin-top:7px;}
  .su-legal{font-size:11.5px; color:var(--muted); text-align:center; margin:22px 0 10px;}
  .su-legal a, .su-login a{color:var(--teal-text); font-weight:500;}
  .su-cta{height:40px; width:100%; justify-content:center;}
  .su-login{font-size:12.5px; color:var(--muted); text-align:center; margin-top:14px;}
  .su-tag{font-size:22px; letter-spacing:-.4px; color:var(--su-ink); transition:color .8s ease;}
  .su-right{position:relative; overflow:hidden; min-height:100%;}
  .su-right img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .8s ease;}
  .su-right img.on{opacity:1;}
  @media (max-width:860px){ .su{grid-template-columns:1fr;} .su-right{display:none;} }
  .onb{position:fixed; inset:0; z-index:40; background:var(--warm); overflow:auto;}
  .onb-top{display:flex; align-items:center; justify-content:space-between; padding:28px 40px 0; gap:12px; flex-wrap:wrap;}
  .onb-brand{display:flex; align-items:center; gap:10px; font-size:22px; color:var(--ink);}
  .onb-brand .word{font-size:23px;}
  .onb-wrap{max-width:1000px; margin:0 auto; padding:40px 24px 56px;}
  .onb h1{font-size:32px; letter-spacing:-0.6px; text-align:center;}
  .onb .sub{font-size:15px; color:var(--muted); text-align:center; margin-top:10px;}
  .steps{display:flex; align-items:center; justify-content:center; gap:14px; margin:28px 0 0; font-size:13px; color:var(--subtle); flex-wrap:wrap;}
  .steps .st{display:flex; align-items:center; gap:8px;}
  .steps i{width:8px; height:8px; border-radius:50%; background:#cfd5d0;}
  .steps .cur{color:var(--ink); font-weight:500;}
  .steps .cur i{background:var(--teal); box-shadow:0 0 0 4px #d8e8de;}
  .steps .done i{background:var(--teal);}
  .steps .line{width:48px; height:1px; background:#dde1dc;}
  .onb-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px; margin-top:40px;}
  .opanel{background:#fff; border:1px solid #eceee9; border-radius:var(--r-lg); padding:26px 24px 24px; display:flex; flex-direction:column; gap:14px; min-width:0;}
  .opanel h3{font-size:17px;}
  .opanel .d{font-size:13.5px; color:var(--muted); margin-top:-8px;}
  .drop{border:1.5px dashed #cbd4ce; border-radius:var(--r); padding:18px; display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--muted); font-size:13px; text-align:center; transition:border-color .2s, background .2s;}
  .drop:hover, .drop.over{border-color:var(--teal); background:#f5faf6;}
  .drop b{color:var(--ink); font-weight:500; font-size:14px;}
  .file{display:flex; align-items:center; gap:10px; font-size:13.5px; min-width:0;}
  .file span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0;}
  .bar{height:4px; border-radius:4px; background:#e3e6e1; overflow:hidden; margin-top:4px;}
  .bar i{display:block; height:100%; background:var(--teal); border-radius:4px; transition:width .3s ease;}
  .sw{display:flex; gap:8px; flex-wrap:wrap;}
  .sw i{width:32px; height:32px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(0,0,0,.07);}
  .thumbs{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .thumbs button{aspect-ratio:1.35; border-radius:var(--r); overflow:hidden; position:relative; border:2px solid transparent; background:var(--chip);}
  .thumbs button.on{border-color:var(--teal);}
  .thumbs button.on::after{content:"✓"; position:absolute; top:6px; right:6px; width:20px; height:20px; border-radius:50%; background:var(--teal); color:#fff; font-size:12px; display:flex; align-items:center; justify-content:center;}
  .thumbs img{width:100%; height:100%; object-fit:cover; display:block;}
  .onb-foot{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-top:36px; flex-wrap:wrap;}
  .curate{max-width:560px; margin:44px auto 0; background:#fff; border:1px solid #eceee9; border-radius:var(--r-lg); padding:28px;}
  .ctask{display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--line); font-size:14px; color:var(--subtle);}
  .ctask:last-child, .ctask:nth-last-child(2){border-bottom:0;}
  .ctask.doing{color:var(--ink);} .ctask.done{color:var(--text);}
  .ctask .dot{width:18px; height:18px; border-radius:50%; border:1.5px solid #cfd5d0; flex-shrink:0;}
  .ctask{min-height:46px;}
  .ctask .spin{width:18px; height:18px;}
  .steps button.st{cursor:pointer;} .steps button.st:hover{color:var(--ink);}
  .curate-foot{min-height:44px;}
  .ctask small{margin-left:auto; font-size:12.5px; color:var(--subtle);}

  /* ---------- home ---------- */
  .hero{position:relative; border-radius:20px; overflow:hidden; padding:64px 24px 48px; display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center;
    background:linear-gradient(180deg, rgba(20,40,80,.28), rgba(20,40,80,.12) 45%, rgba(20,40,80,.30)), var(--hero-img) center 30% / cover no-repeat, #b9c6d6;}
  .page.home{max-width:none; padding:20px 16px 64px;}
  .page.home .home-grid{max-width:1040px; margin-left:auto; margin-right:auto;}
  @media (min-height:820px) and (min-width:1100px){ .hero{min-height:634px; justify-content:center;} }
  .hero h1, .hero .hi{text-shadow:0 1px 12px rgba(10,30,70,.35);}
  .hero .hi{font-size:14px; color:#fff; opacity:.95;}
  .hero h1{font-size:30px; color:#fff; letter-spacing:-0.5px;}
  .prompt{width:min(720px,100%); background:#fff; border-radius:var(--r-lg); padding:14px 14px 10px; text-align:left; box-shadow:0 10px 30px rgba(15,37,35,.12);}
    .prompt-slot{width:min(720px,100%); height:124px;}
  .prompt-slot .prompt{width:100%;}
  .prompt{position:relative; padding:0; height:52px; overflow:hidden; box-shadow:0 6px 20px rgba(15,37,35,.10); transition:height .28s cubic-bezier(.3,.7,.2,1), box-shadow .28s ease;}
  .prompt:focus-within, .prompt.filled{height:124px; box-shadow:0 10px 30px rgba(15,37,35,.12);}
  .prompt textarea{display:block; width:100%; height:64px; min-height:0; padding:15px 64px 0 18px; border:0; outline:none; resize:none; font-size:15px; line-height:22px; background:transparent; overflow:hidden;}
  .prompt-row{pointer-events:none; position:absolute; left:14px; right:8px; top:8px; height:36px; display:flex; align-items:center; gap:8px; transition:top .28s cubic-bezier(.3,.7,.2,1), right .28s cubic-bezier(.3,.7,.2,1);}
  .prompt:focus-within .prompt-row, .prompt.filled .prompt-row{top:78px; right:14px;}
  .prompt-row .send{pointer-events:auto;}
  .prompt-row .chip, .prompt-row .icon-btn{opacity:0; pointer-events:none; transition:opacity .2s ease;}
  .prompt:focus-within .prompt-row .chip, .prompt:focus-within .prompt-row .icon-btn, .prompt.filled .prompt-row .chip, .prompt.filled .prompt-row .icon-btn{opacity:1; pointer-events:auto; transition-delay:.08s;}
  .send{width:36px; height:36px; border-radius:50%; background:var(--teal); color:#fff; display:inline-flex; align-items:center; justify-content:center; margin-left:auto;}
  .send[disabled]{background:#a9c2b9; pointer-events:none;}
  .sugs{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
  .sug-c{display:flex; flex-direction:column; align-items:flex-start; gap:6px; width:170px; padding:12px 14px; border-radius:var(--r); background:rgba(255,255,255,.62); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); text-align:left; font-size:13px; color:var(--ink); border:1px solid rgba(255,255,255,.6);}
  .sug-c:hover{background:rgba(255,255,255,.85);}
  .home-grid{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:20px; margin-top:24px;}
  .list{display:flex; flex-direction:column; gap:8px;}
  .prow{display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:14px; align-items:center; padding:12px 14px; border-radius:var(--r); background:#fff; border:0; text-align:left; width:100%;}
  .prow:hover{background:#fafbf9;}
  .prow b{font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block;}
  .prow small{color:var(--subtle); font-size:12px;}
  .sec-h{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .sec-h h3{font-size:16px;}
  .team-row{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); width:100%; text-align:left;}
  .team-row:last-child{border-bottom:0;}
  .team-row .sq{width:26px; height:26px; border-radius:7px; display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; color:var(--ink); flex-shrink:0;}
  .team-row .amt{margin-left:auto; text-align:right;}
  .team-row .amt b{display:block; font-weight:600;}
  .team-row .amt small{font-size:11.5px; color:var(--subtle);}
  .team-row.low .amt b{color:var(--red);}

  /* ---------- brief ---------- */
  .status{display:flex; align-items:center; gap:10px; min-height:44px; padding:10px 16px; border-radius:var(--r); border:1px solid var(--line2); font-size:13.5px; color:var(--ink); width:100%; text-align:left;}
  .status .chev{margin-left:auto; color:var(--muted); transition:transform .2s; display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; align-self:center;}
  .status .chev svg{display:block;}
  .status[aria-expanded="true"] .chev{transform:rotate(180deg);}
  .status-steps{padding:6px 16px 4px 44px; display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--muted);}
  .status-steps div{display:flex; align-items:center; gap:8px;}
  .brief-grid{display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:20px; align-items:start; margin-top:14px;}
  .brief{padding:6px 22px 10px;}
  .bh{display:flex; align-items:center; gap:10px; padding:14px 0 12px; border-bottom:1px solid var(--line);}
  .bh h2{font-size:16px;}
  .frow{display:grid; grid-template-columns:130px minmax(0,1fr); gap:16px; padding:12px 0; border-bottom:1px solid var(--line); align-items:start;}
  .frow:last-child{border-bottom:0;}
  .ftail{display:inline-grid; align-items:center; justify-items:end; flex-shrink:0;}
  .ftail > *{grid-area:1 / 1;}
  .ftail .src{height:22px; box-sizing:border-box;}
  .fconfirm{display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 10px; border-radius:9999px; background:var(--teal); color:#fff; font-size:11.5px; font-weight:500; white-space:nowrap; visibility:hidden; opacity:0; transition:opacity .15s ease;}
  .fconfirm:hover{background:#2f6153;}
  .sugrow:hover .fconfirm, .sugrow:focus-within .fconfirm{visibility:visible; opacity:1;}
  .sugrow .src{transition:opacity .15s ease;}
  .sugrow:hover .src, .sugrow:focus-within .src{visibility:hidden; opacity:0;}
  @media (hover:none){ .sugrow .fconfirm{visibility:visible; opacity:1;} .sugrow .src{visibility:hidden;} }
  .fok{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; color:var(--teal-text); white-space:nowrap; padding-top:3px;}
  .frow .k{font-size:12.5px; color:var(--muted); padding-top:5px;}
  .fv{display:flex; flex-wrap:wrap; align-items:flex-start; gap:6px 10px; border-radius:8px; padding:4px 8px; margin:0 -8px; min-height:30px;}
  .fv.mem{background:var(--mint);}
  .fv .t{flex:1 1 220px; min-width:0; overflow-wrap:anywhere; outline:none; line-height:1.55; padding-top:1px;}
  .fv .t:focus{box-shadow:0 0 0 2px var(--teal-soft); border-radius:4px;}
  .fv .t:empty::before{content:attr(data-ph); color:var(--subtle);}
  .gap-chip{display:inline-flex; margin-left:0; padding:0 7px; border:1px dashed var(--yellow-line); border-radius:5px; color:#8a6d00; font-size:12.5px; background:#fffbe6;}
  .hint{font-size:11.5px; color:#8a6d00; white-space:nowrap; align-self:center; text-decoration:underline; text-underline-offset:2px; text-decoration-color:#e0c060;}
  button.hint:hover, button.gap-chip:hover{color:#5b4b00;}
  button.gap-chip:hover{background:#fff3c4;}
  .sug.pulse{animation:sugpulse 1.4s ease;}
  @keyframes sugpulse{0%,40%{box-shadow:0 0 0 1px var(--teal), 0 0 0 6px rgba(200,242,95,.7);} 100%{box-shadow:0 0 0 1px var(--teal);}}
  .skel{height:12px; border-radius:6px; background:linear-gradient(90deg,#eef0ec,#f7f8f5,#eef0ec); background-size:200% 100%; animation:sk 1.2s linear infinite; width:70%; margin-top:6px;}
  @keyframes sk{to{background-position:-200% 0;}}
  .check{padding:22px 22px 18px; display:flex; flex-direction:column; gap:12px; position:sticky; top:20px;}
  .check .ch{display:flex; align-items:flex-start; justify-content:space-between;}
  .check h3{font-size:18px;}
  .check .ch small{display:block; font-size:13px; color:var(--muted); margin-top:4px;}
  .fpills{display:flex; gap:8px; flex-wrap:wrap;}
  .fp{display:inline-flex; align-items:center; gap:7px; height:32px; padding:0 12px; border-radius:9999px; background:#eef0ec; font-size:13px; white-space:nowrap;}
  .fp.on{background:#dbeafb; color:#2e5a82;}
  .fp .n{min-width:18px; height:18px; border-radius:9px; background:#d7373b; color:#fff; font-size:11px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; padding:0 5px;}
  .fp .m{color:var(--subtle);}
  .sug{border:1px solid #e3e6e1; border-radius:14px; padding:16px; background:#fff; text-align:left; width:100%; display:block; transition:border-color .15s;}
  .sug:hover{border-color:var(--line2);}
  .sug.sel{border-color:var(--teal); box-shadow:0 0 0 1px var(--teal);}
  .sug .top{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .rd{width:15px; height:15px; border-radius:50%; border:1.5px solid #c3c9c4; flex-shrink:0;}
  .sug.sel .rd{border:5px solid var(--teal);}
  .sug h4{margin:0 0 5px; font-size:15px; font-weight:500; color:var(--ink);}
  .sug p{font-size:13px; line-height:1.55; color:var(--muted);}
  .sug .from{display:flex; align-items:center; gap:6px; margin-top:9px; font-size:12px; color:var(--teal-text);}
  /* brief check sits on the page, cards float like the Node details cards */
  .card.check{background:transparent; border:0; box-shadow:none; padding:0;}
  .check .sug{border:0; border-radius:14px; padding:22px 24px; background:#fff; box-shadow:0 1px 2px rgba(15,37,35,.05), 0 10px 28px -8px rgba(15,37,35,.12); transition:box-shadow .15s, transform .15s;}
  .check .sug:hover{box-shadow:0 1px 2px rgba(15,37,35,.06), 0 14px 34px -8px rgba(15,37,35,.16);}
  .check .sug.sel{box-shadow:0 1px 2px rgba(15,37,35,.06), 0 14px 34px -8px rgba(15,37,35,.18);}
  .check .sug .top{margin-bottom:14px; gap:8px;}
  .check .sug .tag{height:26px; padding:0 12px; border-radius:9999px; font-size:12.5px;}
  .check .sug .tag.gray{background:#e9ece6;}
  .check .sug h4{font-size:17px; font-weight:600; letter-spacing:-.2px; margin-bottom:8px;}
  .check .sug p{font-size:14px; line-height:1.6;}
  .check .sug .from{margin-top:12px;}
  .check .sug .rd{width:16px; height:16px;}
  .check .fp{background:#fff;} .check .fp.on{background:#dbeafb;}
  .fly-chip{position:fixed; z-index:200; display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 12px; border-radius:9999px; background:#151412; color:#fff; font-size:13px; font-weight:500; white-space:nowrap; pointer-events:none; box-shadow:0 10px 24px -6px rgba(15,37,35,.35); transform-origin:left center;}
  .fly-chip svg{color:#c8f25f;}
  .fv.flash{animation:fvflash 1.3s ease;}
  .fv.flash .t{animation:fvin .5s ease;}
  @keyframes fvflash{0%{box-shadow:0 0 0 0 rgba(59,117,103,.35); background:#e4f3ea;} 60%{box-shadow:0 0 0 6px rgba(59,117,103,0);} 100%{box-shadow:0 0 0 0 rgba(59,117,103,0);}}
  @keyframes fvin{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
  .fp.bump .m{animation:bump .5s cubic-bezier(.3,1.6,.5,1); display:inline-block; color:var(--teal-text); font-weight:600;}
  @keyframes bump{0%{transform:scale(1);} 40%{transform:scale(1.5);} 100%{transform:scale(1);}}
  .check .sug.pulse{animation:sugmint 2.6s ease;}
  @keyframes sugmint{0%{background:#fff;} 12%,70%{background:var(--mint);} 100%{background:#fff;}}
  .check .sug-acts{display:flex; justify-content:flex-end; gap:8px; margin-top:16px; padding-top:14px; border-top:1px solid #eef0ec;}
  .check .sug-acts .btn{height:34px; padding:0 14px; font-size:13px;}
  .check .foot{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px;}
  .check .foot.one{grid-template-columns:1fr;}
  .empty-s{padding:26px 10px; text-align:center; color:var(--muted); font-size:13.5px; display:flex; flex-direction:column; align-items:center; gap:8px;}
  .note{font-size:11.5px; color:var(--subtle); text-align:center;}

  /* ---------- image thread ---------- */
  .chat{max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:18px;}
  .ubub{align-self:flex-end; max-width:78%; background:var(--sage2); border-radius:14px; padding:12px 16px; line-height:1.55;}
  .gen{display:flex; flex-direction:column; gap:10px;}
  .gen img{width:100%; max-width:584px; border-radius:var(--r); display:block; background:var(--chip); aspect-ratio:584/360; object-fit:cover;}
  .gen .acts{display:flex; gap:8px; flex-wrap:wrap;}
  .qchips{display:flex; gap:8px; flex-wrap:wrap; margin-top:4px;}
  .qchips .chip{background:#fff; border-color:var(--line2);}
  .reply{position:sticky; bottom:16px; display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); border-radius:var(--r-lg); padding:8px 8px 8px 16px; box-shadow:0 6px 20px rgba(15,37,35,.06);}
  .reply input{flex:1; border:0; outline:none; font-size:14.5px; min-width:0; background:transparent;}

  /* ---------- projects ---------- */
  .table{background:#fff; border-radius:var(--r-lg); overflow:hidden;}
  .trow{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,.8fr) minmax(0,.9fr) minmax(0,.7fr); gap:14px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); width:100%; text-align:left;}
  .trow:last-child{border-bottom:0;}
  .trow.new{background:#e3f1df; animation:newfade 4s ease forwards;}
  .trow.new:hover{background:#e3f1df;}
  .trow.new .newtag{animation:newfade2 4s ease forwards;}
  @keyframes newfade{0%,70%{background:#e3f1df;} 100%{background:transparent;}}
  @keyframes newfade2{0%,70%{opacity:1;} 100%{opacity:0;}}
  .trow .newtag{font-size:11.5px; font-weight:600; color:var(--teal-text); background:#fff; border:1px solid #bcdcb8; border-radius:999px; padding:2px 8px; margin-left:8px; vertical-align:2px;}
  button.trow:hover{background:#fafbf9;}
  .trow.head{font-size:12px; color:var(--subtle); padding-block:10px;}
  .trow b{font-weight:500; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .trow small{font-size:12px; color:var(--subtle);}
  .drawer-bg{position:fixed; inset:0; background:rgba(15,37,35,.22); z-index:30; animation:fadeIn .2s ease;}
  @keyframes fadeIn{from{opacity:0;}}
  .drawer{position:fixed; top:0; right:0; bottom:0; width:min(500px,100%); background:#fff; z-index:31; box-shadow:-24px 0 70px rgba(11,33,31,.2); display:flex; flex-direction:column; padding:30px 32px 0; animation:slideIn .28s cubic-bezier(.2,.8,.2,1); overflow:auto;}
  @keyframes slideIn{from{transform:translateX(40px); opacity:0;}}
  .drawer .dh{display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
  .drawer h2{font-size:22px; letter-spacing:-0.3px;}
  .x{width:32px; height:32px; border-radius:50%; background:var(--chip); display:inline-flex; align-items:center; justify-content:center; color:var(--muted); flex-shrink:0;}
  .x:hover{color:var(--ink);}
  .vf-code{width:100%; height:56px; border-radius:var(--r); border:1px solid #e3e7e0; background:#fff; font-size:24px; letter-spacing:10px; text-align:center; font-weight:500; font-variant-numeric:tabular-nums;}
  .vf-code:focus{outline:0; border-color:var(--teal); box-shadow:0 0 0 1px var(--teal);}
  .lnk{color:var(--teal-text); text-decoration:underline; font:inherit;}
  .drawer .df{display:flex; justify-content:flex-end; gap:12px; align-items:center; padding:22px 0 26px; margin-top:auto;}
  .bhist .kv:last-child{border-bottom:0; padding-bottom:0;}
  .count-n{display:inline-block; transition:color .3s ease, transform .35s cubic-bezier(.3,1.6,.5,1); transform-origin:left center;}
  .count-n.counting{color:#2f6db0;}
  .count-n.bump{color:var(--teal); transform:scale(1.06);}
  .tt .count-n{transform-origin:right center;}
  .kv{display:grid; grid-template-columns:120px minmax(0,1fr); gap:12px; padding:10px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .kv span:first-child{color:var(--muted);}

  /* ---------- brand brain ---------- */
  .bb-hero{background:#e7e9e4; border-radius:var(--r-lg); padding:26px 28px; display:flex; justify-content:space-between; gap:24px; flex-wrap:wrap; align-items:flex-end;}
  .bb-hero h2{font-size:34px; letter-spacing:-0.8px;}
  .bb-hero p{max-width:440px; color:var(--muted); line-height:1.55; margin-top:8px;}
  .stats4{display:grid; grid-template-columns:repeat(4,86px); gap:10px;}
  .st4{background:#d7dcd2; border-radius:12px; padding:10px 12px;}
  .st4 b{display:block; font-size:18px; font-weight:500;}
  .st4 small{font-size:11.5px; color:var(--muted);}
  .grid2{display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:18px;}
  .grid2e{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px; align-items:start;}
  .box{background:#fff; border-radius:var(--r-lg); padding:24px; min-width:0;}
  .box h3{font-size:17px;}
  .box .d{font-size:13.5px; color:var(--muted); margin:6px 0 18px;}
  .sect{font-size:13px; color:var(--muted); margin:28px 0 12px;}
  .colors{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .col{box-shadow:inset 0 0 0 1px rgba(15,37,35,.1); aspect-ratio:1.2; border-radius:10px; padding:10px; display:flex; flex-direction:column; justify-content:flex-end; font-size:11.5px; text-align:left; color:#fff;}
  .col:hover{outline:2px solid var(--ink); outline-offset:2px;}
  .logo-rows{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.2fr); gap:24px; align-items:center;}
  .logo-img{max-height:44px; max-width:70%; margin:0 auto; width:auto; display:block;}
  .logo-tile{height:96px; justify-content:center; border-radius:10px; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:30px; letter-spacing:-1.2px;}
  .lrule{display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .lrule:last-child{border-bottom:0;}
  .lrule .tags{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .models{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px;}
  .model{border:1px solid var(--line); border-radius:var(--r); overflow:hidden; text-align:left; background:#fff;}
  .model img{width:100%; aspect-ratio:1.5; object-fit:cover; display:block;}
  .model div{padding:10px 12px;}
  .model b{font-weight:500; font-size:13.5px;}
  .item{border:1px solid #e6e9e4; border-radius:14px; padding:14px 16px; display:flex; align-items:center; gap:14px;}
  .item + .item{margin-top:10px;}
  .item b{display:block; font-size:14.5px; font-weight:500; color:var(--ink);}
  .item small{display:flex; align-items:center; gap:5px; font-size:12.5px; color:var(--teal-text); margin-top:4px;}
  .item .acts{margin-left:auto; display:flex; gap:8px; flex-shrink:0;}
  .item .th{width:52px; height:52px; border-radius:12px; overflow:hidden; flex-shrink:0;}
  .item .th img{width:100%; height:100%; object-fit:cover; display:block;}
  .stats3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; margin-bottom:18px;}
  .stat{background:#fff; border-radius:var(--r-lg); padding:18px 22px;}
  .stat .l{font-size:13px; color:var(--muted);}
  .stat .n{font-size:30px; font-weight:500; letter-spacing:-0.7px; color:var(--ink); margin-top:6px;}
  .stat .n small{font-size:13px; font-weight:400; letter-spacing:0; margin-left:8px; color:var(--teal-text);}
  .iq-card{display:grid; grid-template-columns:auto minmax(0,1fr); gap:28px; align-items:center; padding:26px 28px;}
  .ring{position:relative; width:150px; height:150px;}
  .ring svg{width:150px; height:150px; transform:rotate(-90deg);}
  .ring circle{fill:none; stroke-width:12;}
  .ring .bg{stroke:#e5f0fa;}
  .ring .fg{stroke:#4a90d0; stroke-linecap:round;}
  .ring b{transition:transform .3s ease, color .3s ease;}
  .ring.counting b{color:#2f6db0;}
  .ring.bump b{transform:scale(1.12); color:var(--teal);}
  .iq-delta{position:absolute; top:10px; right:6px; font-size:13px; font-weight:600; color:var(--teal); animation:fade .3s ease both;}
  .ring b{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:48px; font-weight:500; letter-spacing:-1.5px; color:var(--ink);}
  .iq-next{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;}
  .pillbtn{display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 16px; border-radius:12px; font-size:14px;}
  .pillbtn.y{background:#fdf2c4; border:1px solid #f1dd8c; color:#6b5500;}
  .pillbtn.b{background:#dbeafb; border:1px solid #b9d5f5; color:#2e5a82;}
  .pillbtn .n{min-width:20px; height:20px; border-radius:10px; background:#d7373b; color:#fff; font-size:11.5px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; padding:0 5px;}
  .klist{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .kitem{display:flex; gap:12px; align-items:flex-start; padding:14px 16px; border:1px solid var(--line); border-radius:var(--r); text-align:left; width:100%; background:#fff;}
  .kitem:hover{border-color:var(--line2);}
  .kitem.sel{border-color:var(--teal); box-shadow:0 0 0 1px var(--teal);}
  .kitem.done{background:#f2f5ef; border-color:#e3e8df;}
  .kitem b{display:block; font-weight:500; color:var(--ink); margin-bottom:4px;}
  .kitem small{font-size:12.5px; color:var(--muted); line-height:1.5; display:block;}
  .cbx{width:18px; height:18px; border-radius:50%; border:1.5px solid #c3c9c4; flex-shrink:0; margin-top:1px; display:inline-flex; align-items:center; justify-content:center; color:#fff;}
  .kitem.sel .cbx{border-color:var(--teal); background:var(--teal);}
  .kitem.done .cbx{border:0; background:var(--teal);}

  /* ---------- account ---------- */
  .acct-grid{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:18px; align-items:start;}
  .big-n{font-size:44px; font-weight:500; letter-spacing:-1.2px; color:var(--ink);}
  .tbar{height:8px; border-radius:4px; background:#edf0eb; overflow:hidden; margin-top:8px;}
  .tbar i{display:block; height:100%; border-radius:4px; background:var(--teal); transition:width .6s cubic-bezier(.2,.8,.2,1);}
  .tbar.low i{background:var(--red);}
  .trow2{padding:14px 0; border-bottom:1px solid var(--line);}
  .trow2:last-child{border-bottom:0;}
  .trow2 .tt{display:flex; align-items:center; gap:10px;}
  .trow2 .tt b{font-weight:500;}
  .trow2 .tt .num{margin-left:auto; font-weight:600;}
  .dot{width:10px; height:10px; border-radius:3px; flex-shrink:0;}
  .amounts{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .amounts button{height:54px; border:1px solid var(--line2); border-radius:var(--r); font-size:17px; font-weight:500; background:#fff;}
  .amounts button:hover{border-color:#bfc6c0;}
  .amounts button.on{border:1.5px solid var(--teal); background:#f3f9f5; color:var(--teal-text);}
  .preview{border-radius:14px; background:#f2f5f0; padding:20px 22px;}
  .preview .pn{display:flex; align-items:center; gap:12px; font-size:32px; font-weight:500; letter-spacing:-0.6px; color:var(--ink); margin-top:6px; flex-wrap:wrap;}
  .preview .pn .from{color:#a8b0ab;}
  .dd{position:relative;}
  .ddb{width:100%; height:48px; border-radius:var(--r); border:1px solid #e3e7e0; padding:0 14px; background:#fff; font-size:14.5px; display:flex; align-items:center; justify-content:space-between; text-align:left;}
  .ddb.open{border-color:var(--teal); box-shadow:0 0 0 1px var(--teal);}
  .ddl{position:absolute; top:calc(100% + 6px); left:0; right:0; background:#fff; border:1px solid #e3e7e0; border-radius:var(--r); box-shadow:0 14px 34px -8px rgba(15,37,35,.22); padding:6px; z-index:5;}
  .ddo{width:100%; display:flex; align-items:center; justify-content:space-between; padding:10px 10px; border-radius:8px; font-size:14.5px; text-align:left;}
  .ddo:hover{background:var(--sage2);}
  .ddo.on{font-weight:500;}
  select.sel{width:100%; height:48px; border-radius:var(--r); border:1px solid #e3e7e0; padding:0 14px; background:#fff; font-size:14.5px;}
  .lab{font-size:13px; color:var(--muted); margin:22px 0 10px;}

  /* ---------- toast + proto badge ---------- */
  .toasts{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:60; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none;}
  .toast{background:var(--dark); color:#fff; padding:11px 16px; border-radius:12px; font-size:13.5px; display:flex; align-items:center; gap:10px; box-shadow:0 10px 30px rgba(11,33,31,.25); animation:fade .3s ease both; max-width:min(520px,calc(100vw - 32px));}
  .toast .ok{background:var(--lime); color:var(--dark);}
  .proto{position:fixed; left:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:25; display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:9999px; padding:5px 6px 5px 12px; font-size:12px; color:var(--muted); box-shadow:0 6px 20px rgba(15,37,35,.08);}
  .proto b{color:var(--ink); font-weight:500;}
  .proto .btn{height:26px; padding:0 10px; font-size:12px;}

  /* ---------- responsive ---------- */
  @media (max-width:1200px){ .brief-grid{grid-template-columns:minmax(0,1fr);} .check{position:static;} }
  @media (max-width:1000px){
    .brief-grid, .home-grid, .acct-grid, .grid2, .grid2e{grid-template-columns:minmax(0,1fr);}
    .check{position:static;}
    .onb-grid{grid-template-columns:minmax(0,1fr);}
    .stats4{grid-template-columns:repeat(4,minmax(0,1fr));}
  }
  @media (max-width:760px){
    .app{grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr);}

var IQ_SHOWN = null, IQ_RAF = null;
function animateIQ(){
  var el = document.getElementById('iq-num'), arc = document.getElementById('iq-arc');
  if (!el) return;
  var to = +el.dataset.to, from = +el.textContent, C = +arc.dataset.c;
  if (IQ_RAF) cancelAnimationFrame(IQ_RAF);
  var set = function(n){ el.textContent = n; arc.style.strokeDashoffset = (C * (1 - Math.min(n,100)/100)).toFixed(1); IQ_SHOWN = n; };
  if (from === to || matchMedia('(prefers-reduced-motion: reduce)').matches){ set(to); if (to > from) beem(); return; }
  var dur = Math.min(1400, 350 + Math.abs(to - from) * 45), t0 = performance.now();
  var ring = el.parentNode; ring.classList.add('counting');
  (function tick(now){
    var p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    set(Math.round(from + (to - from) * e));
    if (p < 1) IQ_RAF = requestAnimationFrame(tick); else { ring.classList.remove('counting'); ring.classList.add('bump'); setTimeout(function(){ ring.classList.remove('bump'); }, 450); if (to > from) beem(); }
  })(t0);
}

/* money count-up after a booster, same feel as the Brand IQ count, ending with a soft "beem" */
var BEEM_CTX = null;
function beemPrime(){ try { BEEM_CTX = BEEM_CTX || new (window.AudioContext || window.webkitAudioContext)(); if (BEEM_CTX.state === 'suspended') BEEM_CTX.resume(); } catch(e){} }
function beem(){
  var c = BEEM_CTX; if (!c) return;
  try {
    var t = c.currentTime, out = c.createGain(); out.gain.value = 0.18; out.connect(c.destination);
    [[880, 0], [1318.5, 0.09]].forEach(function(n){
      var o = c.createOscillator(), g = c.createGain(), o2 = c.createOscillator(), g2 = c.createGain();
      o.type = 'sine'; o.frequency.value = n[0]; o2.type = 'sine'; o2.frequency.value = n[0] * 2; g2.gain.value = 0.12;
      g.gain.setValueAtTime(0.0001, t + n[1]); g.gain.exponentialRampToValueAtTime(1, t + n[1] + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + n[1] + 0.55);
      o.connect(g); o2.connect(g2); g2.connect(g); g.connect(out);
      o.start(t + n[1]); o2.start(t + n[1]); o.stop(t + n[1] + 0.6); o2.stop(t + n[1] + 0.6);
    });
  } catch(e){}
}
function countMoney(){
  var els = [].slice.call(document.querySelectorAll('.count-n'));
  var jobs = els.map(function(el){ return {el:el, from:+String(el.textContent).replace(/[^0-9]/g, ''), to:+el.dataset.to}; }).filter(function(j){ return j.from !== j.to; });
  if (!jobs.length) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){ jobs.forEach(function(j){ j.el.textContent = money(j.to); }); beem(); return; }
  var dur = 1300, t0 = performance.now();
  jobs.forEach(function(j){ j.el.classList.add('counting'); });
  (function tick(now){
    var p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    jobs.forEach(function(j){ if (document.body.contains(j.el)) j.el.textContent = money(j.from + (j.to - j.from) * e); });
    if (p < 1) requestAnimationFrame(tick);
    else { jobs.forEach(function(j){ j.el.classList.remove('counting'); j.el.classList.add('bump'); setTimeout(function(){ j.el.classList.remove('bump'); }, 500); }); beem(); }
  })(t0);
}

function render(){
  var html;

  else html = shell(({home:viewHome, brief:viewBrief, image:viewImage, projects:viewProjects, brain:viewBrain, account:viewAccount}[S.route] || viewHome)());

  tourEl.classList.add(side);
  if (side === 'dock'){ top = vh - bh - 12; left = Math.max(16, (vw - bw) / 2); }
  else if (side === 'below' || side === 'above'){
    top = side === 'below' ? r.bottom + gap : r.top - gap - bh;
    left = Math.max(16, Math.min(r.left + r.width / 2 - bw / 2, vw - bw - 16));
    tourEl.style.setProperty('--ay', '');
  } else {
    left = side === 'left' ? r.left - gap - bw : r.right + gap;
    top = Math.max(12, Math.min(r.top + 8, vh - bh - 12));
  }
  top = Math.max(12, Math.min(top, vh - bh - 12));
  tourEl.style.left = left + 'px'; tourEl.style.top = top + 'px';
  tourEl.style.setProperty('--ax', Math.max(14, Math.min(bw - 28, r.left + r.width / 2 - left - 7)) + 'px');
}
document.addEventListener('scroll', tourPlace, true);
// keep the ring glued to its target while things animate in (drawers, fades)
(function follow(){ if (tourEl && tourTarget) tourPlace(); requestAnimationFrame(follow); })();
window.addEventListener('resize', tourPlace);
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-tour]'); if (!b) return;
  e.stopPropagation();
  var a = b.dataset.tour;
  if (a === 'next'){ S.tour.i++; render(); }
  else if (a === 'skip' || a === 'close'){ S.tour.on = false; render(); }
  else if (a === 'restart'){ S = fresh(); ART = {}; go('onboarding'); }
}, true);
// re-check the tour when async work finishes (agents filling, image generation)
setInterval(function(){ if (S.tour && S.tour.on && !tourEl) tourUpdate(); }, 700);

/* ================= start ================= */
var h = (location.hash || '').slice(1);
if (h === 'profile' || h === 'iq'){ S.onb.step = 3; S.bbTab = h; S.route = 'brain'; }
else if (['home','projects','account'].indexOf(h) > -1){ S.onb.step = 3; S.route = h; }
if (S.route !== 'onboarding' && S.route !== 'signup') S.tour = {i:0, on:true, done:false};
render();
})();
</script>
